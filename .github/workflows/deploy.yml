name: Deploy

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: cfe-simulator-api
      ECS_CLUSTER: default
      ECS_SERVICE: cfe-simulator-api-66a5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::467763720896:role/GitHubActionsDeployRole
          role-session-name: GitHubActionsECSDeployment

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get short commit SHA
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Build, tag and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy to ECS Express Mode
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          service-name: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          execution-role-arn: arn:aws:iam::467763720896:role/service-role/ecsTaskExecutionRole
          infrastructure-role-arn: arn:aws:iam::467763720896:role/service-role/ecsInfrastructureRoleForExpressServices
          container-port: 3000
          health-check-path: /health
          min-task-count: 1
          max-task-count: 2
          environment-variables: |
            [
              {"name": "AI_PROVIDER", "value": "claude"},
              {"name": "LOG_LEVEL", "value": "info"},
              {"name": "PORT", "value": "3000"},
              {"name": "FRONTEND_URL", "value": "${{ vars.FRONTEND_URL }}"},
              {"name": "DATABASE_URL", "value": "${{ secrets.DATABASE_URL }}"},
              {"name": "REDIS_URL", "value": "${{ secrets.REDIS_URL }}"},
              {"name": "JWT_SECRET", "value": "${{ secrets.JWT_SECRET }}"},
              {"name": "JWT_REFRESH_SECRET", "value": "${{ secrets.JWT_REFRESH_SECRET }}"},
              {"name": "ANTHROPIC_API_KEY", "value": "${{ secrets.ANTHROPIC_API_KEY }}"},
              {"name": "GEMINI_API_KEY", "value": "${{ secrets.GEMINI_API_KEY }}"}
            ]
